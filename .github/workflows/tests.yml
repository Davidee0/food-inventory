# Continuous integration (lecture 9): on every push and pull request, GitHub builds the app and runs all tests.
# A red cross on the pull request means something is broken; merge only when it is green.
name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (xUnit + Moq)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test backend/FoodInventory.sln --collect:"XPlat Code Coverage" --logger "console;verbosity=normal"

  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

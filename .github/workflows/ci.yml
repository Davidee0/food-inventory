# CI with automated testing (Lecture 1): runs on every pull request and on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: food_inventory
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: food_inventory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Database from database.sql
        run: psql -v ON_ERROR_STOP=1 -f database.sql
      - name: Build
        run: dotnet build backend/FoodInventory.slnx
      - name: Start the API and call it
        run: |
          dotnet run --no-build --project backend/FoodInventory.API --launch-profile http > api.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:5050/api/StorageLocation && break; sleep 1; done
          # expect STATUS METHOD PATH [JSON]
          expect() {
            data=(); if [ -n "$4" ]; then data=(-d "$4"); fi
            code=$(curl -s -o body.txt -w "%{http_code}" -X "$2" -H "Content-Type: application/json" "${data[@]}" "http://localhost:5050$3")
            echo "$2 $3: $code"
            if [ "$code" != "$1" ]; then echo "expected $1"; cat body.txt; cat api.log; exit 1; fi
          }
          today=$(date +%F)
          expect 200 GET /api/FoodItem
          grep -q '"name":"Milk"' body.txt
          expect 200 GET /api/FoodItem/1
          expect 404 GET /api/FoodItem/9999
          expect 200 POST /api/FoodItem "{\"name\":\"Bread\",\"quantity\":1,\"purchaseDate\":\"$today\",\"storageLocationId\":3}"
          expect 200 PUT /api/FoodItem "{\"id\":11,\"name\":\"Bread\",\"quantity\":2,\"purchaseDate\":\"$today\",\"bestBeforeDate\":null,\"categoryId\":6,\"storageLocationId\":3}"
          expect 200 GET /api/FoodItem/11
          grep -q '"quantity":2' body.txt
          expect 400 POST /api/FoodItem "{\"name\":\"\",\"quantity\":0,\"purchaseDate\":\"$today\",\"storageLocationId\":3}"
          expect 400 POST /api/FoodItem "{\"name\":\"Bread\",\"quantity\":1,\"purchaseDate\":\"$today\",\"bestBeforeDate\":\"2000-01-01\",\"storageLocationId\":3}"
          expect 204 DELETE /api/FoodItem/11
          expect 404 DELETE /api/FoodItem/11
          expect 200 POST /api/Category '{"id":0,"name":"Snacks"}'
          expect 200 PUT /api/Category '{"id":7,"name":"Treats"}'
          expect 204 DELETE /api/Category/7
          expect 409 DELETE /api/Category/1
          expect 409 DELETE /api/StorageLocation/1
          expect 200 GET /swagger/v1/swagger.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx prettier --check src
      - run: npx ng build
      - run: npx ng test --watch=false

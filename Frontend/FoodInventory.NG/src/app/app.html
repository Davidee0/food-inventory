<!-- Lecture 8: Angular Material toolbar with a menu of router links. -->
<mat-toolbar>
  <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Menu">
    <mat-icon>menu</mat-icon>
  </button>
  <span>{{ title() }}</span>
  <span class="spacer"></span>
  <a mat-button routerLink="/add-food-item">Add food</a>
</mat-toolbar>

<mat-menu #menu="matMenu">
  <button mat-menu-item routerLink="/food-items">My food</button>
  <button mat-menu-item routerLink="/add-food-item">Add food</button>
  <button mat-menu-item routerLink="/categories">Categories</button>
  <button mat-menu-item routerLink="/storage-locations">Storage locations</button>
</mat-menu>

<!-- The router shows the component that belongs to the address (app.routes.ts). -->
<main>
  <router-outlet />
</main>

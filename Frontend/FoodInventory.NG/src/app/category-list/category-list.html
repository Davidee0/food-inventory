<main class="wrap">
  <h2>Categories</h2>
  @if (message()) {
    <p class="form-error" role="alert">{{ message() }}</p>
  }

  <form (ngSubmit)="add()">
    <label for="cat-new">New category</label>
    <div class="add-row">
      <input id="cat-new" name="newName" type="text" autocomplete="off" [(ngModel)]="newName" />
      <button type="submit" class="btn primary">Add category</button>
    </div>
  </form>

  @if (!loaded()) {
    <p class="state">Loading categories…</p>
  } @else if (!categories().length && !message()) {
    <p class="state">No categories yet. Add one above.</p>
  }

  <ul class="list">
    @for (category of categories(); track category.id) {
      <li>
        <app-category-card
          [category]="category"
          (rename)="rename(category, $event)"
          (remove)="remove(category)"
        />
      </li>
    }
  </ul>
</main>

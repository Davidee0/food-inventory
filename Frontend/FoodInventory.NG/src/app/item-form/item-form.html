<dialog #dialog aria-labelledby="item-title" (close)="closed.emit()">
  <form (ngSubmit)="save()">
    <h2 id="item-title">{{ item ? 'Edit item' : 'Add item' }}</h2>
    @if (message()) {
      <p class="form-error" role="alert">{{ message() }}</p>
    }

    <div class="field">
      <label for="f-name">Name</label>
      <input
        id="f-name"
        name="name"
        type="text"
        autocomplete="off"
        aria-describedby="e-name"
        [(ngModel)]="form.name"
        (ngModelChange)="clear('name')"
        [attr.aria-invalid]="errors()['name'] ? true : null"
      />
      <p class="err" id="e-name">{{ errors()['name'] }}</p>
    </div>

    <div class="field">
      <label for="f-location">Storage location</label>
      <select
        id="f-location"
        name="locationId"
        aria-describedby="e-location"
        [(ngModel)]="form.locationId"
        (ngModelChange)="clear('locationId')"
        [attr.aria-invalid]="errors()['locationId'] ? true : null"
      >
        <option [ngValue]="null">Choose a storage location</option>
        @for (location of locations; track location.id) {
          <option [ngValue]="location.id">{{ location.name }}</option>
        }
      </select>
      <p class="err" id="e-location">{{ errors()['locationId'] }}</p>
    </div>

    <div class="field">
      <label for="f-category">Category <span class="hint">(optional)</span></label>
      <select
        id="f-category"
        name="categoryId"
        aria-describedby="e-category"
        [(ngModel)]="form.categoryId"
        (ngModelChange)="clear('categoryId')"
        [attr.aria-invalid]="errors()['categoryId'] ? true : null"
      >
        <option [ngValue]="null">No category</option>
        @for (category of categories; track category.id) {
          <option [ngValue]="category.id">{{ category.name }}</option>
        }
      </select>
      <p class="err" id="e-category">{{ errors()['categoryId'] }}</p>
    </div>

    <div class="field">
      <label for="f-purchase">Purchase date</label>
      <input
        id="f-purchase"
        name="purchaseDate"
        type="date"
        aria-describedby="e-purchase"
        [(ngModel)]="form.purchaseDate"
        (ngModelChange)="clear('purchaseDate')"
        [attr.aria-invalid]="errors()['purchaseDate'] ? true : null"
      />
      <p class="err" id="e-purchase">{{ errors()['purchaseDate'] }}</p>
    </div>

    <div class="field">
      <label for="f-best">Best before date <span class="hint">(optional)</span></label>
      <input
        id="f-best"
        name="bestBefore"
        type="date"
        aria-describedby="e-best"
        [(ngModel)]="form.bestBefore"
        (ngModelChange)="clear('bestBefore')"
        [attr.aria-invalid]="errors()['bestBefore'] ? true : null"
      />
      <p class="err" id="e-best">{{ errors()['bestBefore'] }}</p>
    </div>

    <div class="actions">
      <button type="submit" class="btn primary" [disabled]="saving()">Save</button>
      <button type="button" class="btn" (click)="dialog.close()">Cancel</button>
    </div>
  </form>
</dialog>

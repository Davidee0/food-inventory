<app-top-bar eyebrow="Setup" title="Storage locations" [back]="inventory.lastMain" />

<div class="body">
  @if (message()) {
    <p class="form-error" role="alert">{{ message() }}</p>
  }

  <form novalidate (ngSubmit)="add()">
    <div class="rowbtns">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>New location</mat-label>
        <input
          matInput
          id="loc-new"
          name="newName"
          autocomplete="off"
          placeholder="e.g. Cellar"
          [(ngModel)]="newName"
        />
      </mat-form-field>
      <button mat-flat-button type="submit" class="small">Add</button>
    </div>
  </form>

  <ul class="cat-list">
    @for (row of rows(); track row.id) {
      <li class="cat">
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Name</mat-label>
          <input
            matInput
            autocomplete="off"
            [attr.aria-label]="'Name of location ' + row.name"
            [(ngModel)]="row.draft"
            (keydown.enter)="rename(row)"
          />
        </mat-form-field>
        <p class="meta">{{ count(row) }}</p>
        <div class="rowbtns">
          <button
            mat-stroked-button
            type="button"
            class="small"
            [attr.aria-label]="'Save name of ' + row.name"
            (click)="rename(row)"
          >
            Save name
          </button>
          <button
            mat-stroked-button
            type="button"
            class="small danger"
            [attr.aria-label]="'Delete location ' + row.name"
            (click)="remove(row)"
          >
            Delete
          </button>
        </div>
      </li>
    }
  </ul>
</div>

<h2>Categories</h2>

<table>
  @for (category of categories; track category.id) {
    <tr>
      <td>
        <input type="text" [(ngModel)]="category.name" required maxlength="30" #name="ngModel" />
      </td>
      <td>
        <button (click)="updateCategory(category)" [disabled]="name.invalid">Save</button>
        <button (click)="deleteCategory(category)">Delete</button>
      </td>
    </tr>
  }
  <tr>
    <td>
      <input
        type="text"
        [(ngModel)]="newName"
        placeholder="New category"
        required
        maxlength="30"
        #newNameField="ngModel"
      />
    </td>
    <td>
      <button (click)="addCategory()" [disabled]="newNameField.invalid">Add</button>
    </td>
  </tr>
</table>

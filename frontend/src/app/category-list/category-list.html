<h2>Categories</h2>
@for (category of categories; track category.id) {
  <div class="row">
    <input aria-label="Category name" [(ngModel)]="category.name" maxlength="30" />
    <button (click)="updateCategory(category)" [disabled]="!category.name.trim()">Save</button>
    <button (click)="deleteCategory(category)">Delete</button>
  </div>
}
<form class="row" (ngSubmit)="addCategory()">
  <input
    name="newName"
    aria-label="New category"
    placeholder="New category"
    [(ngModel)]="newName"
    maxlength="30"
  />
  <button type="submit" [disabled]="!newName.trim()">Add</button>
</form>

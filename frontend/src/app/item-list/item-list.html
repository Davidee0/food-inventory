@for (item of items; track item.id) {
  <div class="card">
    <h2>{{ item.name }}</h2>
    <p>{{ item.locationName }}{{ item.categoryName ? ', ' + item.categoryName : '' }}</p>
    <p>Bought {{ item.purchaseDate | date }}</p>
    @if (item.bestBefore) {
      <p>Best before {{ item.bestBefore | date }}</p>
    }
    <a [routerLink]="['/edit-item', item.id]">Edit</a>
    <button (click)="deleteItem(item)">Delete</button>
  </div>
} @empty {
  <p>No items yet.</p>
}

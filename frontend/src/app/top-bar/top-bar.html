<mat-toolbar class="top">
  @if (back(); as back) {
    <a mat-icon-button class="square" [routerLink]="back" aria-label="Back"
      ><app-icon name="back"
    /></a>
  } @else {
    <span class="logo">U8</span>
  }
  <div class="titles">
    <p class="eyebrow">{{ eyebrow() }}</p>
    <h1>{{ title() }}</h1>
  </div>
  @if (!back()) {
    <!-- The gear opens the settings menu (lecture 8: the items move into a mat-menu in the toolbar) -->
    <button
      mat-icon-button
      type="button"
      class="gear"
      aria-label="Settings"
      [matMenuTriggerFor]="settings"
      (menuOpened)="inventory.lastMain = router.url"
    >
      <app-icon name="gear" />
    </button>
    <mat-menu #settings="matMenu" xPosition="before">
      <a mat-menu-item routerLink="/settings/categories">Categories</a>
      <a mat-menu-item routerLink="/settings/locations">Storage locations</a>
    </mat-menu>
  }
</mat-toolbar>

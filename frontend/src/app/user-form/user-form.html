<app-top-bar eyebrow="Account" title="User" back="/settings" />

<form class="body" novalidate (ngSubmit)="save()">
  <p class="hint-box">For now the user is saved on this device only.</p>

  <label class="field">
    <span class="lbl">Username <b>*</b></span>
    <input
      name="username"
      autocomplete="off"
      placeholder="e.g. kilian"
      [(ngModel)]="form.username"
      [attr.aria-invalid]="errors()['username'] ? true : null"
    />
  </label>
  <p class="error" aria-live="polite">{{ errors()['username'] }}</p>

  <label class="field">
    <span class="lbl">Email</span>
    <input
      name="email"
      type="email"
      autocomplete="off"
      placeholder="name@example.com"
      [(ngModel)]="form.email"
      [attr.aria-invalid]="errors()['email'] ? true : null"
    />
  </label>
  <p class="error" aria-live="polite">{{ errors()['email'] }}</p>

  <button type="submit" class="cta"><app-icon name="check" [size]="22" /> Save user</button>
</form>

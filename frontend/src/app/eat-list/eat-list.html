@if (items.length === 0) {
  <p>Nothing to eat. Add some food first.</p>
}

@for (item of items; track item.id) {
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ item.name }}</mat-card-title>
      <mat-card-subtitle>
        {{ item.quantity }} left
        @if (expiryText(item)) {
          · <strong>{{ expiryText(item) }}</strong>
        }
      </mat-card-subtitle>
    </mat-card-header>
    <mat-card-actions align="end">
      <button mat-flat-button (click)="ateOne(item)"><mat-icon>check</mat-icon> Ate it</button>
    </mat-card-actions>
  </mat-card>
}

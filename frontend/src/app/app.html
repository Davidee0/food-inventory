<div class="app">
  <main class="page"><router-outlet /></main>

  @if (inventory.toast(); as toast) {
    <p class="toast" role="status">
      <app-icon name="tick" [size]="26" />
      <span class="toast-text">{{ toast.text }}</span>
      @if (toast.undo; as undo) {
        <button type="button" (click)="undo()">Undo</button>
      }
    </p>
  }

  <nav class="tabbar" aria-label="Main">
    <ul>
      <li>
        <a class="tab" routerLink="/add" routerLinkActive="active" ariaCurrentWhenActive="page">
          <app-icon name="plus" /><span>Add</span>
        </a>
      </li>
      <li>
        <a class="tab" routerLink="/items" routerLinkActive="active" ariaCurrentWhenActive="page">
          <app-icon name="list" /><span>Inventory</span>
        </a>
      </li>
      <li>
        <a class="tab" routerLink="/eat" routerLinkActive="active" ariaCurrentWhenActive="page">
          <app-icon name="check" /><span>Ate it</span>
        </a>
      </li>
    </ul>
  </nav>
</div>
